chat_terms_label: Baldintzak
chat_terms_description: |
  Baldintza hauek erabiltzaile guztiei erakutsiko zaizkie txat-geletara sartzean.
  Igorleek beren kanaletarako baldintzak ere konfigura ditzakete, eta baldintza orokor hauen ondoren erakutsiko dira.
list_rooms_label: Zerrendatu dauden gelak
federation_no_remote_chat_label: Ez erakutsi urruneko txatak
federation_no_remote_chat_description: |
  Ezarpen hau markatuz gero, zure instantziak ez ditu inoiz urruneko bideoetako txatak erakutsiko.
federation_dont_publish_remotely_label: Ez argitaratu txataren informazioa
federation_dont_publish_remotely_description: |
  Ezarpen hau markatuz gero, zure instantziak ez du txataren informaziorik argitaratuko fedibertsoan.
  Urruneko PeerTube instantziek ez dute jakingo zure bideoei lotutako txat-gelak daudenik.<br>
  <b>Kontuan hartu</b>: dagoeneko txatak abian bazenituen, baliteke informazioa argitaratuta egotea.
  Bideoaren hurrengo eguneraketara itxaron beharko duzu informazioa argitaratzeari uzteko.
  Era berean, ezarpen hau desgaitzen baduzu, bideoak eguneratu arte itxaron beharko duzu informazioa
  berriz argitaratzeko. Eguneraketa hori gertatzen da, besteak beste, zuzeneko bat berriz hasten edo gelditzen denean.<br>
  <b>Kontuan hartu</b>: ezarpen honek ActivityPub protokoloaren bidezko informazio-argitalpenari soilik eragiten dio.
  Ez du eragotziko urruneko aplikazio batek txatak daudela beste modu batean detektatzea eta haietara konektatzen saiatzea.
