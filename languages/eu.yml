all_non_lives_description: Markatuta badago, txata gaituta egongo da zuzenekoak 
  ez diren bideo guztietarako.
videos_list_label: Gaitu txata bideo hauetarako
no_anonymous_label: Ezkutatu txata erabiltzaile anonimoei
no_anonymous_description: |
  Markatuta badago, PeerTubeko erabiltzaile anonimoek ez dute txata ikusiko.
  Eginbide hau esperimentala da oraindik.
  Gaitzen baduzu, oso gomendagarria da "Ez argitaratu txataren informazioa" ere markatzea.
  Bestela, hirugarrenen tresna batzuk txata irekitzen saia daitezke, eta portaera ezustekoak izan.
auto_ban_anonymous_ip_label: Debekatu erabiltzaile anonimoaren IPa txat-gela 
  batetik debekatzen denean
auto_ban_anonymous_ip_description: |
  Aukera hau gaituz gero, erabiltzaile anonimo bat txat-gela batetik debekatzen den bakoitzean, haren IPa ere debekatuko da txat-zerbitzarian.
  Kontuz: zure instantzia izen-ematera irekita badago, edozein erabiltzailek tranpa-gela bat sor dezake, erabiltzaileak sartzera gonbidatu eta erabiltzaile anonimo guztien IPak automatikoki debekatu.
  Debekatutako IPen zerrenda ez da gordetzen; zerbitzaria berrabiaraztean edo osagarriaren ezarpen batzuk aldatzean garbituko da.
  Debekatutako IPak Prosody zerbitzariaren erregistro-fitxategietan jasotzen dira; beraz, zerbitzariaren administratzaileek kanpoko tresnak (fail2ban, adibidez) erabil ditzakete IPak modu zabalagoan debekatzeko.
avatar_set_label: Abatar-sorta
avatar_set_option_sepia: Sepia (PeerTuberen maskota)
avatar_set_option_cat: Katuak
avatar_set_option_bird: Txoriak
avatar_set_option_fenec: Fenekak (Mobilizonen maskota)
avatar_set_option_abstract: Abstraktuak
avatar_set_option_legacy: Sepiaren abatar zaharrak (osagarriaren aurreko 
  bertsioetan zeudenak)
avatar_set_option_none: Bat ere ez
converse_theme_label: ConverseJS gaia
converse_theme_description: Aukeratu erabili nahi duzun ConverseJS gaia.
converse_theme_option_peertube: PeerTube gaia
converse_theme_option_default: ConverseJS gai lehenetsia
converse_theme_option_cyberpunk: ConverseJS Cyberpunk gaia
autocolors_label: Koloreen detekzio automatikoa
autocolors_description: |
  Saiatu koloreak automatikoki detektatzen erabiltzailearen uneko gaitik.<br>
  Ezarpen hau gaituta dagoenean, osagarria txataren gaiari aplikatu beharreko koloreak automatikoki detektatzen saiatzen da.<br>
  Zure PeerTube gairen batekin behar bezala ez badabil, aukera hau desgai dezakezu.
  Akatsaren berri eman dezakezu
  <a href="https://github.com/JohnXLivingston/peertube-plugin-livechat/issues" target="_blank">
    arazoen jarraipen-sistema
  </a> ofizialean. Ez ahaztu zein gaik ez duen funtzionatzen zehaztea.
chat_style_label: Txataren iframearen style atributua
chat_style_description: |
  Iframearen style atributuari gehitu beharreko estilo gehigarriak. <br>
  Adibidea: height:400px;
help_builtin_prosody_label: Prosody zerbitzaria
help_builtin_prosody_description: |
  Osagarri honek Prosody XMPP zerbitzaria erabiltzen du txat-gelak kudeatzeko.<br>
  Osagarri honek Prosody AppImage bat dakar, zerbitzua exekutatzeko erabiliko dena.
system_prosody_label: Erabili sistemako Prosody
system_prosody_description: |
  Kontuz: ez markatu ezarpen hau zertan ari zaren ziur ez bazaude.<br>
  Ezarpen hau markatuz gero, zure PeerTubek zure sistemarekin datorren Prosody zerbitzaria erabiliko du,
  eta ez txertatutako AppImagea.<br>
  Erabili hau soilik txertatutako Prosodyrekin arazoak badituzu.
disable_websocket_label: Desgaitu Websocket
disable_websocket_description: |
  PeerTube &gt;= 5.0.0 bertsioarekin, osagarri hau Websocket konexioa erabiltzen saiatzen da txaterako.
  Erabiltzailearen nabigatzailea edo konexioa bateraezina bada, nabigatzaileak automatikoki BOSH protokoloa erabiliko du.
  <br>
  Baina kasu bakanetan, horrek huts egin dezake. Adibidez, PeerTuberen aurrean alderantzizko proxy bat baduzu eta
  osagarrientzako Websocket konexioak baimentzen ez baditu.
  Kasu horretan, ezarpen hau marka dezakezu Websocket konexioak desgaitzeko.
prosody_port_label: Prosody ataka
prosody_port_description: |
  Prosody zerbitzariak erabiliko duen ataka.<br>
  Aldatu ataka hori zure zerbitzarian dagoeneko erabiltzen ari bada.<br>
  Ataka hau zure suebakian itxi dezakezu, ez baita kanpotik atzituko.<br>
  Oharra: hau alda daiteke etorkizun hurbilean, kanpoko konexioak gaitzeko eginbide bat gehitzea aurreikusita baitago.
prosody_peertube_uri_label: API deietarako PeerTube URLa
prosody_peertube_uri_description: |
  Utzi ezarpen hau hutsik zertan ari zaren ez badakizu.<br>
  Kasu bakan batzuetan, Prosodyk ezin du PeerTuberen APIa deitu haren URI publikotik.
  Eremu hau erabil dezakezu Prosody moduluentzako PeerTuberen URIa pertsonalizatzeko
  (adibidez, «http://localhost:9000» edo «http://127.0.0.1:9000» erabiliz).
prosody_muc_log_by_default_label: Gorde gelen edukia lehenespenez
prosody_muc_log_by_default_description: |
  Markatuta badago, gelen edukia lehenespenez gordeko da.
  Gela batera sartzen den edozein erabiltzailek ikusiko du sartu aurretik idatzitakoa.<br>
  Kontuan hartu gela jakin baten edukiaren artxibatzea
  beti gai/desgai daitekeela, haren propietateak editatuz.
prosody_muc_expiration_label: Gelen erregistroen iraungitzea
prosody_room_allow_s2s_label: Gaitu geletara kanpoko XMPP kontuekin konektatzea
prosody_room_allow_s2s_description: |
  Aukera hau gaituz gero, geletara konektatu ahal izango da kanpoko XMPP kontuak eta XMPP bezeroak erabiliz.<br>
  <span class="peertube-plugin-livechat-warning">
    <b>Kontuz</b>: aukera hau gaitzeak zerbitzariaren eta DNSaren konfigurazio gehigarria eska dezake.
  </span>
  Ikusi dokumentazioa:
  <a href="https://livingston.frama.io/peertube-plugin-livechat/documentation/admin/advanced/xmpp_clients/" target="_blank">
    Gaitu kanpoko XMPP kontuen konexioak.
  </a>
prosody_s2s_port_label: Prosodyren zerbitzaritik zerbitzarirako ataka
prosody_s2s_port_description: |
  XMPP s2s (zerbitzaritik zerbitzarira) konexioetarako erabiliko den ataka.<br>
  5269 ataka estandarra erabili beharko zenuke.
  Bestela, <a href="https://prosody.im/doc/s2s">
    DNS erregistro berezi bat konfiguratu
  </a> beharko zenuke.
prosody_s2s_interfaces_label: Zerbitzaritik zerbitzarirako sare-interfazeak
prosody_s2s_interfaces_description: |
  Zerbitzaritik zerbitzarirako konexioak entzuteko sare-interfazeak.<br>
  Entzun beharreko IPen zerrenda, komaz bereizita (zuriuneak kenduko dira).<br>
  «*» erabil dezakezu IPv4 interfaze guztiak entzuteko, eta «::» IPv6 guztietarako.<br>
  Adibideak:
  <ul>
    <li>*, ::</li>
    <li>*</li>
    <li>127.0.0.1, ::1</li>
    <li>172.18.0.42</li>
  </ul>
prosody_certificates_dir_label: Ziurtagirien karpeta
prosody_certificates_dir_description: |
  Eremu hau hutsik badago, osagarriak auto-sinatutako ziurtagiriak sortu eta erabiliko ditu.<br>
  Beste ziurtagiri batzuk erabili nahi badituzu, zehaztu hemen Prosodyk haiek aurki ditzakeen
  karpeta. Oharra: "peertube" erabiltzaileak irakurtzeko sarbidea izan behar du karpeta honetan.
prosody_c2s_label: Gaitu bezerotik zerbitzarirako konexioak
prosody_c2s_description: |
  Baimendu XMPP bezeroei barneko Prosody zerbitzarira konektatzea.<br>
  Aukera honek, bakarrik, localhost bezeroen konexioak baino ez ditu baimentzen.
prosody_c2s_port_label: Prosodyren bezerotik zerbitzarirako ataka
prosody_c2s_port_description: |
  Barneko Prosody zerbitzariaren c2s moduluak erabiliko duen ataka.<br>
  XMPP bezeroek ataka hau erabili beharko dute konektatzeko.<br>
  Aldatu ataka hori zure zerbitzarian dagoeneko erabiltzen ari bada.<br>
  Oraingoz, ataka hau itxita utz dezakezu zure suebakian, ez baita kanpotik atzituko.<br>
  Oharra: hau alda daiteke etorkizun hurbilean, kanpoko konexioak gaitzeko eginbide bat gehitzea aurreikusita baitago.
prosody_c2s_interfaces_label: Bezerotik zerbitzarirako sare-interfazeak
prosody_c2s_interfaces_description: |
  Bezerotik zerbitzarirako konexioak entzuteko sare-interfazeak.<br>
  Ezarpen hau erabiltzaile aurreratuentzat da. Ez aldatu ezarpen hau zer esan nahi duen guztiz ulertzen ez baduzu.<br>
  Entzun beharreko IPen zerrenda, komaz bereizita (zuriuneak kenduko dira).<br>
  «*» erabil dezakezu IPv4 interfaze guztiak entzuteko, eta «::» IPv6 guztietarako.<br>
  Adibideak:
  <ul>
    <li>*, ::</li>
    <li>*</li>
    <li>127.0.0.1, ::1</li>
    <li>127.0.0.1, ::1, 172.18.0.42</li>
  </ul>
prosody_components_label: Gaitu Prosodyren kanpoko osagai pertsonalizatuak
prosody_components_description: |
  Gaitu kanpoko XMPP osagaien erabilera.<br>
  Aukera honek, bakarrik, localhost-eko konexioak baino ez ditu baimentzen.
  Entzuteko interfazeak konfiguratu eta ataka zure suebakian ireki behar duzu urruneko zerbitzarietatik erabilgarri egon dadin.<br>
  Eginbide hau, adibidez, bot batzuk txat-geletara konektatzeko erabil daiteke.
prosody_components_port_label: Prosodyren kanpoko osagaien ataka
prosody_components_port_description: |
  XMPP osagaiek Prosody zerbitzarira konektatzeko erabiliko duten ataka.<br>
  Aldatu ataka hori zure zerbitzarian dagoeneko erabiltzen ari bada.<br>
  Ataka hau itxita utz dezakezu zure suebakian, localhost ez den beste interfazerik baimentzen ez baduzu.
prosody_components_interfaces_label: Prosodyren kanpoko osagaien 
  sare-interfazeak
prosody_components_interfaces_description: |
  Kanpoko osagaien konexioak entzuteko sare-interfazeak.<br>
  Entzun beharreko IPen zerrenda, komaz bereizita (zuriuneak kenduko dira).<br>
  «*» erabil dezakezu IPv4 interfaze guztiak entzuteko, eta «::» IPv6 guztietarako.<br>
  Adibideak:
  <ul>
    <li>*, ::</li>
    <li>*</li>
    <li>127.0.0.1, ::1</li>
    <li>172.18.0.42</li>
  </ul>
prosody_components_list_label: Kanpoko osagaiak
