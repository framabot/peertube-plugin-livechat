  erregular gisa
livechat_configuration_channel_forbidden_words_regexp_desc: Aukera hau markatuz 
  gero, adierazpen erregularrak erabil ditzakezu.
livechat_configuration_channel_forbidden_words_label_label: Etiketa
livechat_configuration_channel_forbidden_words_label_desc: Debekatutako hitzen 
  arau honen etiketa
livechat_configuration_applytomoderators_label: Moderatu moderatzaileen mezuak 
  ere
livechat_configuration_applytomoderators_desc: |
  Lehenespenez, eginbide honek ez die eragingo moderatzaileen mezuei.
  Aukera hau markatuz gero, moderatzaileen mezuak ere ezabatuko dira.
livechat_configuration_channel_forbidden_words_comments_label: Iruzkinak
livechat_configuration_channel_forbidden_words_comments_desc: |
  Arau honi buruzko iruzkin batzuk gehi ditzakezu hemen, nola eta zergatik sortu zenuen gogoratzeko.
  Iruzkin hauek orientagarriak dira soilik, eta ez dute eraginik botaren portaeran.
livechat_configuration_channel_quote_label: Tenporizadorea
livechat_configuration_channel_quote_desc: |
  Aldian-aldian mezuak bidaliko dituzten hainbat tenporizadore konfigura ditzakezu.
  Mezu hauek botak bidaliko ditu X minuturo.
  Adibidez, botak babesleei buruzko informazioa bidal dezake 5 minuturo.
livechat_configuration_channel_quote_label2: Mezuak
livechat_configuration_channel_quote_desc2: |
  Mezu bat lerro bakoitzeko.
  Hainbat mezu badaude, bat ausaz aukeratuko du X minuturo.
livechat_configuration_channel_quote_delay_label: Bidali X minuturo
livechat_configuration_channel_quote_delay_desc: |
  Botak mezua X minuturo argitaratuko du.
livechat_configuration_channel_command_label: Botaren komandoa
livechat_configuration_channel_command_desc: |
  Bota komandoei erantzuteko konfigura dezakezu.
  Komando bat "!" batekin hasten den mezu bat da; adibidez, "!help" mezuak "help" komandoa deitzen du.
livechat_configuration_channel_command_cmd_label: Komandoa
livechat_configuration_channel_command_cmd_desc: |
  Komandoa, hasierako "!" gabe. Adibidez, "help", "sponsor", ...
livechat_configuration_channel_command_message_label: Mezua
livechat_configuration_channel_command_message_desc: Bidali beharreko mezua.
livechat_configuration_channel_for_more_info: |
