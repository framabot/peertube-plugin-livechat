emoji_only_mode_title: Emoji soilik modua
emoji_only_mode_desc_1: |
  "Emoji soilik modua" gai dezakezu zure txat-geletan.
  Modu hau gaituta dagoenean, parte-hartzaileek emojiak baino ezin dituzte bidali (estandarrak edo kanalaren emoji pertsonalizatuak).
