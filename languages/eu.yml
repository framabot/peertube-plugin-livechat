  Hau da, erabiltzaile batek mezu bera bi aldiz bidaltzen badu X segundoren barruan, bigarren mezua ezabatuko da.
livechat_configuration_channel_no_duplicate_delay_label: Denbora-tartea
livechat_configuration_channel_no_duplicate_delay_desc: |
  Erabiltzaile batek mezu bera berriz bidali ezin duen denbora-tartea, segundotan.
