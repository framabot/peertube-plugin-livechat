share_chat_dock_tips: |
  Txata orri osoan irekiko duen esteka bat sor dezakezu, zure PeerTube kontuarekin saioa hasita.
  Hau erabil daiteke, adibidez, zure OBSn web-panel bat izateko, txata OBStik zuzenean irakurri eta harekin elkarreragiteko.
  Ez partekatu esteka hau inorekin, zu zarela konektatzeko aukera emango bailieke.
  Behean dituzu dagoeneko sortu dituzun autentifikazio-tokenen zerrenda.
  Berri bat sor dezakezu, edo aurreko edozein token baliogabetu.
  Kontuan hartu token hauek ez dutela iraungitze-datarik.
