enable_users_regexp: Gaitu adierazpen erregularrak txat-gelen debekatutako 
  hitzetarako
enable_users_regexp_description: |
  Eginbide hau gaituz gero, igorleek adierazpen erregularrak erabili ahal izango dituzte txatbota konfiguratzean.
  Ez zenuke eginbide hau gaitu behar zure erabiltzaileez fidatzen ez bazara (txat-gelak sor ditzaketenez, hau da, zuzeneko igorpenak sor ditzaketenez).
  Erabiltzaile maltzur batek berariaz landutako adierazpen erregular bat sor dezake, eta botaren zerbitzu-ukapena eragin.
diagnostic: |
  Laguntza eskatu aurretik, erabili diagnostiko-tresna:
  <a class="peertube-plugin-livechat-launch-diagnostic">Abiarazi diagnostikoa</a>
  (botoi honek leiho berririk irekitzen ez badu, saiatu orria freskatzen).
chat_title: <h3>Txata</h3>
list_rooms_description: |
  <a class="peertube-plugin-livechat-prosody-list-rooms-btn">Zerrendatu gelak</a>
federation_description: |
  <h3>Federazioa</h3>
  Ezarpen hauek beste PeerTube instantzia batzuekin eta fedibertsoko
  beste software batzuekin egiten den federazioari dagozkio.
external_auth_description: |
  <h3>Kanpoko autentifikazioa</h3>
  PeerTube konturik ez duten erabiltzaileentzat, urruneko autentifikazio-hornitzaileetan oinarritutako hainbat autentifikazio modu gai ditzakezu.
external_auth_custom_oidc_title: <h4>OpenID Connect</h4>
external_auth_custom_oidc_description: |
  Txatean saioa hasteko erabil daitekeen kanpoko OpenID Connect hornitzaile bat konfigura dezakezu.
  Ikusi dokumentazioa:
  <a href="https://livingston.frama.io/peertube-plugin-livechat/documentation/admin/settings/" target="_blank">Ezarpenak</a>.
external_auth_oidc_redirect_uris_info_description: |
  <strong>Itzulera-/birbideratze-URIa:</strong>
  Kanpoko aplikazioan baimendutako birbideratze-URIa konfiguratu nahi baduzu, gehitu URL hau:
chat_behaviour_description: <h3>Txataren portaera</h3>
per_live_video_warning_description: |
  <span class="peertube-plugin-livechat-warning">
    «Erabiltzaileek beren zuzenekoetarako txata gai dezakete» ezarpena gaitu duzu.
    Erredundantea da «Gaitu txata zuzeneko guztietarako» ezarpenarekin.
  </span>
theming_advanced_description: <h3>Gaiak</h3>
avatar_set_description: |
  Txateko erabiltzaileentzat erabiliko diren abatar lehenetsiak hainbat sortaren artean aukera ditzakezu.
  Ikusi dokumentazioa:
  <a href="https://livingston.frama.io/peertube-plugin-livechat/documentation/admin/settings/" target="_blank">Ezarpenak</a>.
prosody_advanced_description: <h3>Txat-zerbitzariaren ezarpen aurreratuak</h3>
prosody_muc_expiration_description: |
  Hemen aukera dezakezu zerbitzariak zenbat denboraz gordeko duen txat-gelen edukia. Balioa hau izan daiteke:
  <ul>
      <li><b>60</b>: edukia 60 <b>segundoz</b> gordeko da. 60 edozein zenbaki osorekin ordez dezakezu.</li>
      <li><b>1d</b>: edukia <b>egun</b> 1ez gordeko da. 1 edozein zenbaki osorekin ordez dezakezu.</li>
      <li><b>1w</b>: edukia <b>aste</b> 1ez gordeko da. 1 edozein zenbaki osorekin ordez dezakezu.</li>
      <li><b>1m</b>: edukia <b>hilabete</b> 1ez gordeko da. 1 edozein zenbaki osorekin ordez dezakezu.</li>
      <li><b>1y</b>: edukia <b>urte</b> 1ez gordeko da. 1 edozein zenbaki osorekin ordez dezakezu.</li>
      <li><b>never</b>: edukia ez da inoiz iraungiko, eta betiko gordeko da.</li>
  </ul>
prosody_components_list_description: |
  Deklaratu beharreko kanpoko osagaiak:
  <ul>
    <li>Bat lerro bakoitzeko.</li>
    <li>Erabili «osagaiaren_izena:osagaiaren_sekretua» formatua (zuriuneak kenduko dira).</li>
    <li>Iruzkinak gehi ditzakezu: # karakterearen ondorengo guztia kenduko da, eta lerro hutsak ez dira kontuan hartuko.</li>
    <li>Izenak latin karaktere alfanumerikoak eta puntuak soilik izan ditzake.</li>
    <li>
      Izenak karaktere alfanumerikoak soilik baditu, XMPP domeinua gehituko zaio atzizki gisa.
      Adibidez, «bridge» «bridge.zure_domeinua.tld» bihurtuko da.
      Domeinu-izen osoa ere zehaztu dezakezu, baina zure DNSa behar bezala konfiguratu behar duzu.
    </li>
    <li>Erabili karaktere alfanumerikoak soilik pasaesaldi sekretuan (erabili gutxienez 15 karaktere).</li>
  </ul>
experimental_warning: |
  <b class="peertube-plugin-livechat-experimental">Eginbide esperimentala:</b> eginbide hau esperimentala da oraindik.
configuration_description: |
  <h3>Kanalaren konfigurazio aurreratua</h3>
  Ezarpen hauek kanalaren aukera aurreratuei dagozkie:
  erabiltzaileek pertsonalizazio batzuk gehitu ahal izango dituzte beren kanaletan,
  moderazio-bota gaitu, ...
livechat_configuration_channel_slow_mode_desc: |
  Modu motelaren balio lehenetsia:
  <ul>
    <li>0: modu motela desgaituta</li>
    <li>Edozein zenbaki oso positibo: erabiltzaileek mezu bat bidal dezakete X segundoan behin (moderatzaileak ez daude mugatuta)</li>
  </ul>
auth_description: |
  <h3>Autentifikazioa</h3>
livechat_token_disabled_description: |
  Erabiltzaileek iraupen luzeko tokenak sor ditzakete txatera konektatzeko.
  Token hauek, adibidez, txata OBSren web-paneletan sartzeko erabil daitezke.
  Ikusi <a href="https://livingston.frama.io/peertube-plugin-livechat/documentation/user/obs" target="_blank">dokumentazioa</a> informazio gehiagorako.
  Eginbide hau desgai dezakezu ezarpen hau markatuz.
livechat_configuration_channel_moderation_delay_desc: |
  Moderazio-atzerapenaren balio lehenetsia:
  <ul>
    <li>0: moderazio-atzerapena desgaituta</li>
    <li>Edozein zenbaki oso positibo: moderatzaileak ez diren parte-hartzaileentzat mezuak X segundoz atzeratuko dira, moderatzaileek mezua ezabatu ahal izan dezaten inork irakurri aurretik.</li>
  </ul>
prosody_firewall_description: |
  <a href="https://modules.prosody.im/mod_firewall" target="_blank">mod_firewall</a> gai dezakezu zure Prosody zerbitzarian.
  Informazio gehiagorako, ikusi <a href="https://livingston.frama.io/peertube-plugin-livechat/documentation/admin/mod_firewall/" target="_blank">dokumentazioa</a>.
prosody_firewall_configure_button: |
  <a class="peertube-button-link orange-button secondary-button" href="/p/livechat/admin/firewall" target="_blank">Konfiguratu mod_firewall</a>
prosody_firewall_configuration_help: |
  Hemen Prosodyren <a href="https://modules.prosody.im/mod_firewall" target="_blank">mod_firewall</a> modulua konfigura dezakezu.
  Behean hainbat konfigurazio-fitxategi sor ditzakezu, eta haien ordena aldatu.
  Ez izan zalantzarik zure konfigurazioak komunitatearekin partekatzeko (adibidez, osagarriaren dokumentazioan adibide batzuk gehituz).
prosody_firewall_disabled_warning: |
  Kontuz: mod_firewall desgaituta dago livechat <a href="/admin/plugins/show/peertube-plugin-livechat" target="_blank">osagarriaren ezarpenetan</a>; gaitu egin behar duzu konfigurazio hau kontuan har dadin.
emoji_only_mode_desc_2: |
  Modu hau erabilgarria izan daiteke, adibidez:
  <ul>
    <li>Spama edo mezu iraingarriak saihesteko, moderatzeko bertan ez zaudenean.</li>
    <li>Hizketan ari diren parte-hartzaile gehiegi daudenean, eta ezin duzunean jada behar bezala moderatu.</li>
  </ul>
converse_theme_warning_description: |
  <span class="peertube-plugin-livechat-warning">
    Oso gomendagarria da "PeerTube gaia" mantentzea, "Koloreen detekzio automatikoa" eginbidearekin batera.
    Bestela, erabiltzaile batzuek arazoak izan ditzakete erabiltzen duten PeerTube gaiaren arabera.
  </span>
videos_list_description: |
  Txata izatea nahi dugun bideoen UUIDak (UUID laburra edo UUIDv4).
  Zuzenekoak ez diren bideoak izan daitezke. Bat lerro bakoitzeko. <br />
  Iruzkinak gehi ditzakezu: # karakterearen ondorengo guztia kenduko da, eta lerro hutsak ez dira kontuan hartuko.<br />
  Ez gehitu bideo pribaturik, UUIDak interfazera bidaliko baitira.
