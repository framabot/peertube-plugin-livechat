external_auth_facebook_oidc_label: Erabili Facebook
external_auth_facebook_oidc_description: |
  Hau gaituz gero, "Hasi saioa Facebookekin" botoi bat gehituko da.
  Facebook OAuth aplikazio bat konfiguratu behar duzu.
