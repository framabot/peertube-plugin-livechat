livechat_configuration_channel_forbidden_words_desc: |
  Botak automatikoki moderatuko dituen hitz batzuk konfigura ditzakezu (hitz horiek dituzten mezuak berehala ezabatuko dira).
  Aukerako arrazoi bat ere gehi dezakezu, ezabatutako mezuen lekuan erakutsiko dena.
  Dokumentazioaren orrian hainbat adibide daude.
