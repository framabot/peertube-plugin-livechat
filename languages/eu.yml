  Aukera hau gaituz gero, moderazio-botak automatikoki ezabatuko ditu X karaktere berezi baino gehiago dituzten mezuak.
  Karaktere bereziak kategoria hauetako batean sartzen ez direnak dira: letrak, zenbakiak, puntuazio-ikurrak, moneta-ikurrak, emojiak.
